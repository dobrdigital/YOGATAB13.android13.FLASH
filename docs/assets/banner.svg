<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="YOGATAB13.android13.FLASH — Lenovo Yoga Tab 13 YT-K606F: Android 11 to Android 13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#22c1ee"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2d4d"/>
      <stop offset="1" stop-color="#0f1629"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="60" r="220" fill="#22c1ee" opacity="0.06"/>
  <circle cx="160" cy="380" r="200" fill="#3ddc84" opacity="0.05"/>

  <!-- text block -->
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#8ea0c8" font-size="20" letter-spacing="4">LENOVO YOGA TAB 13 · YT-K606F · YOGA PAD PRO</text>
    <text x="72" y="160" fill="#ffffff" font-size="54" font-weight="700">YOGATAB13.<tspan fill="url(#accent)">android13</tspan>.FLASH</text>
    <text x="72" y="206" fill="#c9d3ea" font-size="24">Official Android 13 on units sold as “global” — without a brick.</text>
    <text x="72" y="240" fill="#8ea0c8" font-size="20">Официальный Android 13 на «глобальных» китайских планшетах — без кирпича.</text>

    <!-- version chips -->
    <g transform="translate(72,280)">
      <rect width="170" height="52" rx="26" fill="#2a1a22" stroke="#ff5a6e" stroke-opacity="0.6"/>
      <text x="85" y="34" fill="#ff8a98" font-size="22" font-weight="600" text-anchor="middle">Android 11</text>
      <path d="M190 26 H238 M226 14 L240 26 L226 38" fill="none" stroke="#c9d3ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="258" width="170" height="52" rx="26" fill="#0f2a22" stroke="#3ddc84" stroke-opacity="0.8"/>
      <text x="343" y="34" fill="#3ddc84" font-size="22" font-weight="700" text-anchor="middle">Android 13</text>
      <text x="456" y="34" fill="#8ea0c8" font-size="19">0 errors · tested 2026-09-23 · EN / RU</text>
    </g>
  </g>

  <!-- tablet illustration -->
  <g transform="translate(930,78) rotate(-6)">
    <rect x="0" y="0" width="300" height="200" rx="18" fill="#05070d" stroke="#3a4a70" stroke-width="3"/>
    <rect x="12" y="12" width="276" height="176" rx="8" fill="url(#screen)"/>
    <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#3ddc84">
      <text x="26" y="40">$ fh_loader --sendxml=rawprogram*</text>
      <text x="26" y="60" fill="#8ea0c8">  Sahara protocol completed</text>
      <text x="26" y="80" fill="#8ea0c8">  REGION (0xE9): 00 -> unbound</text>
      <text x="26" y="100" fill="#8ea0c8">  setbootablestoragedrive</text>
      <text x="26" y="124">{All Finished Successfully}</text>
      <text x="26" y="144" fill="#22c1ee">  S510234_231224_ROW · Android 13</text>
    </g>
    <!-- kickstand cylinder -->
    <rect x="-14" y="150" width="30" height="62" rx="15" fill="#1b2340" stroke="#3a4a70" stroke-width="2"/>
  </g>

  <text x="1208" y="370" fill="#5d6d94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="end" letter-spacing="2">REAILISM.DEV</text>
</svg>
